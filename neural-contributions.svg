<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ML/Data Contributor</title>
  <desc id="desc">Animated neural network visualization inspired by GitHub contributions, data pipelines, and model training.</desc>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --grid: #238636;
      --grid-dim: #0e4429;
      --text: #c9d1d9;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #58a6ff;
      --good: #3fb950;
      --warn: #d29922;
    }

    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .title { fill: var(--text); font: 700 24px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: var(--muted); font: 500 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .metric { fill: var(--text); font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .small { fill: var(--muted); font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .wire { stroke: var(--line); stroke-width: 1.2; }
    .pulse-wire { stroke: var(--accent); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 5 170; animation: flow 4s linear infinite; opacity: .9; }
    .neuron { fill: #21262d; stroke: #8b949e; stroke-width: 1.2; }
    .neuron.hot { fill: #1f6feb; stroke: #79c0ff; animation: glow 2.8s ease-in-out infinite; }
    .cell { rx: 2; ry: 2; fill: var(--grid-dim); opacity: .85; }
    .cell.active { fill: var(--grid); animation: cellPulse 3.2s ease-in-out infinite; }
    .dot { fill: var(--good); animation: moveData 4.2s linear infinite; }
    .loss { stroke: var(--good); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: 420; stroke-dashoffset: 420; animation: drawLoss 5s ease-in-out infinite; }
    .axis { stroke: var(--line); stroke-width: 1; }
    .badge { fill: #1f6feb; opacity: .18; stroke: #58a6ff; stroke-width: 1; }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(88, 166, 255, 0)); }
      50% { filter: drop-shadow(0 0 10px rgba(88, 166, 255, .9)); }
    }

    @keyframes cellPulse {
      0%, 100% { opacity: .55; }
      45% { opacity: 1; }
    }

    @keyframes flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -175; }
    }

    @keyframes moveData {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      50% { transform: translate(250px, 0); opacity: 1; }
      84% { opacity: 1; }
      100% { transform: translate(525px, 0); opacity: 0; }
    }

    @keyframes drawLoss {
      0% { stroke-dashoffset: 420; opacity: .35; }
      55% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: .55; }
    }
  </style>

  <rect class="bg" width="900" height="360" rx="14"/>
  <rect class="panel" x="24" y="24" width="852" height="312" rx="12"/>

  <text class="title" x="54" y="66">ML/Data Contributor</text>
  <text class="label" x="54" y="91">GitHub activity as training signal for continuous engineering growth</text>

  <rect class="badge" x="655" y="44" width="168" height="34" rx="17"/>
  <text class="metric" x="678" y="66">loss ↓  accuracy ↑</text>

  <text class="label" x="58" y="132">contributions</text>
  <g transform="translate(58 148)">
    <rect class="cell active" x="0" y="0" width="12" height="12" style="animation-delay: .0s"/>
    <rect class="cell" x="16" y="0" width="12" height="12"/>
    <rect class="cell active" x="32" y="0" width="12" height="12" style="animation-delay: .3s"/>
    <rect class="cell" x="48" y="0" width="12" height="12"/>
    <rect class="cell active" x="64" y="0" width="12" height="12" style="animation-delay: .6s"/>
    <rect class="cell" x="80" y="0" width="12" height="12"/>
    <rect class="cell active" x="96" y="0" width="12" height="12" style="animation-delay: .9s"/>

    <rect class="cell" x="0" y="16" width="12" height="12"/>
    <rect class="cell active" x="16" y="16" width="12" height="12" style="animation-delay: .2s"/>
    <rect class="cell active" x="32" y="16" width="12" height="12" style="animation-delay: .5s"/>
    <rect class="cell" x="48" y="16" width="12" height="12"/>
    <rect class="cell active" x="64" y="16" width="12" height="12" style="animation-delay: .8s"/>
    <rect class="cell active" x="80" y="16" width="12" height="12" style="animation-delay: 1.1s"/>
    <rect class="cell" x="96" y="16" width="12" height="12"/>

    <rect class="cell active" x="0" y="32" width="12" height="12" style="animation-delay: .4s"/>
    <rect class="cell active" x="16" y="32" width="12" height="12" style="animation-delay: .7s"/>
    <rect class="cell" x="32" y="32" width="12" height="12"/>
    <rect class="cell active" x="48" y="32" width="12" height="12" style="animation-delay: 1.0s"/>
    <rect class="cell" x="64" y="32" width="12" height="12"/>
    <rect class="cell active" x="80" y="32" width="12" height="12" style="animation-delay: 1.3s"/>
    <rect class="cell active" x="96" y="32" width="12" height="12" style="animation-delay: 1.6s"/>

    <rect class="cell" x="0" y="48" width="12" height="12"/>
    <rect class="cell active" x="16" y="48" width="12" height="12" style="animation-delay: .6s"/>
    <rect class="cell active" x="32" y="48" width="12" height="12" style="animation-delay: .9s"/>
    <rect class="cell" x="48" y="48" width="12" height="12"/>
    <rect class="cell active" x="64" y="48" width="12" height="12" style="animation-delay: 1.2s"/>
    <rect class="cell" x="80" y="48" width="12" height="12"/>
    <rect class="cell active" x="96" y="48" width="12" height="12" style="animation-delay: 1.5s"/>
  </g>

  <text class="label" x="235" y="132">feature layer</text>
  <text class="label" x="390" y="132">hidden layers</text>
  <text class="label" x="595" y="132">output</text>

  <g>
    <line class="wire" x1="190" y1="170" x2="255" y2="150"/>
    <line class="wire" x1="190" y1="190" x2="255" y2="210"/>
    <line class="wire" x1="285" y1="150" x2="390" y2="150"/>
    <line class="wire" x1="285" y1="150" x2="390" y2="210"/>
    <line class="wire" x1="285" y1="210" x2="390" y2="150"/>
    <line class="wire" x1="285" y1="210" x2="390" y2="210"/>
    <line class="wire" x1="420" y1="150" x2="500" y2="130"/>
    <line class="wire" x1="420" y1="150" x2="500" y2="190"/>
    <line class="wire" x1="420" y1="210" x2="500" y2="190"/>
    <line class="wire" x1="420" y1="210" x2="500" y2="250"/>
    <line class="wire" x1="530" y1="130" x2="610" y2="190"/>
    <line class="wire" x1="530" y1="190" x2="610" y2="190"/>
    <line class="wire" x1="530" y1="250" x2="610" y2="190"/>

    <path class="pulse-wire" d="M190 180 C235 175, 235 150, 270 150 C330 150, 335 210, 405 210 C460 210, 480 190, 515 190 C565 190, 575 190, 625 190"/>

    <circle class="dot" cx="190" cy="180" r="5"/>

    <circle class="neuron hot" cx="270" cy="150" r="15" style="animation-delay: .1s"/>
    <circle class="neuron hot" cx="270" cy="210" r="15" style="animation-delay: .4s"/>
    <circle class="neuron hot" cx="405" cy="150" r="15" style="animation-delay: .7s"/>
    <circle class="neuron hot" cx="405" cy="210" r="15" style="animation-delay: 1.0s"/>
    <circle class="neuron hot" cx="515" cy="130" r="15" style="animation-delay: 1.3s"/>
    <circle class="neuron hot" cx="515" cy="190" r="15" style="animation-delay: 1.6s"/>
    <circle class="neuron hot" cx="515" cy="250" r="15" style="animation-delay: 1.9s"/>
    <circle class="neuron hot" cx="625" cy="190" r="18" style="animation-delay: 2.1s"/>
  </g>

  <g transform="translate(682 132)">
    <text class="label" x="0" y="0">training curve</text>
    <line class="axis" x1="0" y1="128" x2="150" y2="128"/>
    <line class="axis" x1="0" y1="20" x2="0" y2="128"/>
    <path class="loss" d="M4 118 C22 103, 32 102, 45 84 C58 65, 73 88, 86 61 C101 31, 118 50, 144 26"/>
    <text class="small" x="6" y="153">commits processed</text>
  </g>

  <text class="metric" x="58" y="302">Continuous learning, continuous shipping.</text>
  <text class="small" x="58" y="323">AWS · Databricks · Spark · MLflow · LLMs · RAG · Semantic Search</text>
</svg>
